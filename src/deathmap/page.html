<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>croclipper death map</title>
<style>
  :root {
    --bg: #0e0f11; --surface: #15171a; --surface-2: #1c1f23; --line: #272a30;
    --text: #e6e8eb; --muted: #979da6; --accent: #f0a63a; --accent-tint: rgba(240, 166, 58, 0.12);
    --radius: 6px; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  .app { display: grid; height: 100dvh; grid-template-columns: 232px minmax(0, 1fr) 300px; grid-template-areas: "side main info"; }
  aside.side { grid-area: side; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px 14px 24px; }
  main.main { grid-area: main; position: relative; min-width: 0; min-height: 0; }
  section.info { grid-area: info; border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 16px 24px; }
  @media (max-width: 1180px) {
    .app { grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: "side main" "side info"; grid-template-rows: 64vh auto; height: auto; min-height: 100dvh; }
    section.info { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 720px) { .app { display: block; } main.main { height: 70vh; } aside.side { border-right: 0; border-bottom: 1px solid var(--line); } }
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .stamp { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .group { margin: 16px 0 0; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .facet { display: grid; gap: 1px; }
  .facet button, .seg button { background: none; border: 0; border-radius: var(--radius); cursor: pointer; color: var(--text); }
  .facet button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; text-align: left; padding: 5px 8px; }
  .facet button:hover, .seg button:hover { background: var(--surface-2); }
  .facet button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent-tint); font-weight: 600; }
  .count { color: var(--muted); font-size: 12px; }
  .seg { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; }
  .seg button { flex: 1; padding: 4px 6px; }
  label.check { display: flex; align-items: center; gap: 8px; padding: 4px 2px; cursor: pointer; }
  select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 9px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .legend { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: rgba(14, 15, 17, 0.8); padding: 6px 9px; border-radius: var(--radius); pointer-events: none; }
  .north { position: absolute; right: 14px; top: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 9px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; text-align: right; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .list li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 8px; border-radius: var(--radius); }
  .list button { all: unset; display: flex; justify-content: space-between; gap: 8px; width: 100%; cursor: pointer; padding: 3px 8px; border-radius: var(--radius); box-sizing: border-box; }
  .list button:hover, .list button[aria-pressed="true"] { background: var(--accent-tint); }
  .list li:has(button) { padding: 0; }
  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .detail[hidden] { display: none; }
  .note { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px; }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Filters">
    <h1>Death map</h1>
    <p class="stamp"><a href="index.html">Library</a> · <span id="stamp"></span></p>
    <p class="stamp" id="coverage"></p>
    <div class="group"><h2>Map</h2><div class="facet" id="maps"></div></div>
    <div class="group"><h2>Side</h2><div class="seg" id="side"></div></div>
    <div class="group"><h2>Killed by</h2><div class="facet" id="groups"></div></div>
    <div class="group"><h2>Only</h2>
      <label class="check"><input type="checkbox" id="behind"> from behind</label>
      <label class="check"><input type="checkbox" id="hs"> headshot</label>
      <label class="check"><input type="checkbox" id="opening"> opening death</label>
    </div>
    <div class="group"><h2>Match</h2><select id="match" aria-label="Match"></select></div>
  </aside>
  <main class="main">
    <canvas id="plot" aria-label="Deaths plotted on the map"></canvas>
    <div class="north">north ↑</div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
  </main>
  <section class="info" aria-label="Summary">
    <div class="detail" id="detail" hidden></div>
    <div class="group"><h2>Summary</h2><dl class="stats" id="stats"></dl></div>
    <div class="group"><h2>Killed most by</h2><ul class="list" id="weapons"></ul></div>
    <div class="group"><h2>Where killers stood</h2><ul class="list" id="kspots"></ul></div>
    <div class="group"><h2>Where he died</h2><ul class="list" id="dspots"></ul></div>
  </section>
</div>
<script type="application/json" id="data">/*__DATA__*/null</script>
<script>
/*__VIEW__*/
</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const GROUPS = ["rifle", "sniper", "smg", "pistol", "shotgun", "other"];
const LABEL = { rifle: "Rifle", sniper: "AWP / sniper", smg: "SMG", pistol: "Pistol", shotgun: "Shotgun", other: "Other (grenade, knife, world)" };
const COLOR = { rifle: "#f0a63a", sniper: "#ff5c7a", smg: "#4cc3ff", pistol: "#7ddc6e", shotgun: "#c792ff", other: "#b8bec6" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const day = (iso) => (iso ? iso.slice(0, 10) : "unknown date");
const matchLabel = (m) => (m.dateFrom === "added" ? "added " : "") + day(m.date);

let mapI = 0, f = { ...ALL }, rows = [], sum = null, spot = null, hoverSpot = null, picked = null, hover = null, view = null;

// Local time, as the library page shows its own "Updated" stamp.
$("stamp").textContent = "built " + new Date(DATA.generatedAt).toLocaleString();
function seg(id, opts, key) {
  $(id).innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("");
  $(id).onclick = (e) => { const b = e.target.closest("button"); if (b) { f[key] = b.dataset.v; reset(); } };
}
seg("side", [["all", "Both"], ["CT", "● CT"], ["T", "▲ T"]], "side");
for (const id of ["behind", "hs", "opening"]) $(id).onchange = () => { f[id] = $(id).checked; reset(); };
$("match").onchange = () => { f.match = Number($("match").value); reset(); };
$("maps").onclick = (e) => { const b = e.target.closest("button"); if (b) { mapI = Number(b.dataset.i); f = { ...ALL }; view = null; reset(); } };
$("groups").onclick = (e) => { const b = e.target.closest("button"); if (b) { f.group = b.dataset.v; reset(); } };
$("legend").innerHTML = GROUPS.map((g) => `<span class="swatch" style="background:${COLOR[g]}"></span>${esc(LABEL[g].replace(/ \(.*/, ""))}`).join(" &nbsp; ") + " &nbsp;·&nbsp; ● CT ▲ T · line to the killer";

function reset() { spot = null; picked = null; render(); }

function render() {
  const M = DATA.maps[mapI];
  $("maps").innerHTML = DATA.maps.map((m, i) => `<button type="button" data-i="${i}" aria-pressed="${i === mapI}"><span>${esc(m.map)}</span><span class="count num">${m.rows.length}</span></button>`).join("");
  const cov = (c) => `${c.withPositions} of ${c.total} ${c.total === 1 ? "match has" : "matches have"} positions`;
  $("coverage").innerHTML = (M ? `${esc(M.map)}: ${cov(M.coverage)}<br>` : "") + `All maps: ${cov(DATA.coverage)}`
    + (DATA.coverage.withPositions < DATA.coverage.total ? '<br><span title="Demos parsed before the death map whose file has left demos/store/ cannot get positions.">The rest were parsed before the death map and their demo is gone.</span>' : "");
  if (!M || !M.rows.length) {
    $("stats").innerHTML = '<dd class="empty">No death with a position on this map.</dd>';
    for (const id of ["weapons", "kspots", "dspots", "groups"]) $(id).innerHTML = "";
    $("match").innerHTML = '<option value="-1">No match with positions</option>';
    $("detail").hidden = true; rows = []; sum = summarize([], 0);
    if (M) draw();
    return;
  }
  for (const b of $("side").children) b.setAttribute("aria-pressed", String(b.dataset.v === f.side));
  for (const id of ["behind", "hs", "opening"]) $(id).checked = f[id];
  const base = M.rows.filter((x) => passes(x, { ...f, group: "all" }));
  $("groups").innerHTML = [["all", "All"], ...GROUPS.map((g) => [g, LABEL[g]])].map(([g, l]) =>
    `<button type="button" data-v="${g}" aria-pressed="${f.group === g}"><span>${g === "all" ? "" : `<span class="swatch" style="background:${COLOR[g]}"></span>`}${esc(l)}</span><span class="count num">${g === "all" ? base.length : base.filter((x) => x.g === g).length}</span></button>`).join("");
  $("match").innerHTML = `<option value="-1">All matches (${M.matches.length})</option>` + M.matches.map((m, i) => `<option value="${i}"${f.match === i ? " selected" : ""}>${esc(matchLabel(m))} · ${m.rounds.CT + m.rounds.T} rounds</option>`).join("");
  rows = M.rows.filter((x) => passes(x, f));
  sum = summarize(rows, roundsFor(M.matches, f));
  const pct = (n, d) => (d ? Math.round((100 * n) / d) + "%" : "–");
  const o = sum.other;
  $("stats").innerHTML = [
    ["Deaths", sum.total], ["Per round played", sum.perRound === null ? "–" : sum.perRound.toFixed(2) + ` <span class="note">(${sum.rounds} rounds)</span>`],
    ["By an enemy", sum.enemy], ["From behind", pct(sum.behind, sum.facingKnown) + (sum.facingKnown < sum.enemy ? ` <span class="note">of ${sum.facingKnown} known</span>` : "")],
    ["Headshot", pct(sum.hs, sum.enemy)], ["Average kill distance", sum.avgDistance === null ? "–" : sum.avgDistance.toFixed(1) + " m"],
    ["Suicide / world / team", `${o.suicide} / ${o.world} / ${o.team}`],
  ].map(([k, v]) => `<dt>${k}</dt><dd class="num">${v}</dd>`).join("");
  $("weapons").innerHTML = sum.weapons.slice(0, 6).map(([w, n]) => `<li><span>${esc(w)}</span><span class="num count">${n}</span></li>`).join("") || '<li class="note">none</li>';
  const spotList = (id, list, which) => {
    $(id).innerHTML = list.slice(0, 8).map((s, i) => `<li><button type="button" data-k="${which}" data-i="${i}" aria-pressed="${spot && spot.which === which && spot.i === i}"><span>${which === "k" ? "K" : "D"}${i + 1} <span class="note">(${s.x}, ${s.y})</span></span><span class="num count">${s.n}</span></button></li>`).join("") || '<li class="note">none</li>';
  };
  spotList("kspots", sum.killerSpots, "k");
  spotList("dspots", sum.deathSpots, "d");
  showDetail();
  draw();
}

for (const id of ["kspots", "dspots"]) {
  const el = $(id);
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; const s = { which: b.dataset.k, i: Number(b.dataset.i) }; spot = spot && spot.which === s.which && spot.i === s.i ? null : s; render(); };
  el.onmouseover = (e) => { const b = e.target.closest("button"); hoverSpot = b ? { which: b.dataset.k, i: Number(b.dataset.i) } : null; draw(); };
  el.onmouseleave = () => { hoverSpot = null; draw(); };
}
const spotOf = (s) => (s ? (s.which === "k" ? sum.killerSpots : sum.deathSpots)[s.i] : null);

// Plot: game X right, game Y up (north), one scale for both axes.
const cv = $("plot"), ctx = cv.getContext("2d");
let backdrop = null;
function layout() {
  const M = DATA.maps[mapI], r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
  for (let i = 0; i < M.backdrop.length; i += 2) add(M.backdrop[i] * M.cell, M.backdrop[i + 1] * M.cell);
  for (const x of M.rows) { if (x.v) add(...x.v); if (x.a) add(...x.a); }
  if (!(x1 > x0)) { x0 = -1000; x1 = 1000; y0 = -1000; y1 = 1000; }
  const pad = 24 * dpr, s = Math.min((cv.width - 2 * pad) / (x1 - x0 || 1), (cv.height - 2 * pad) / (y1 - y0 || 1));
  const ox = (cv.width - (x1 - x0) * s) / 2, oy = (cv.height - (y1 - y0) * s) / 2;
  view = { dpr, s, px: (x) => ox + (x - x0) * s, py: (y) => cv.height - oy - (y - y0) * s, map: mapI, w: cv.width, h: cv.height };
  backdrop = document.createElement("canvas"); backdrop.width = cv.width; backdrop.height = cv.height;
  const b = backdrop.getContext("2d"), c = Math.max(1, M.cell * s) + 0.6 * dpr; // a hair over one cell, so neighbours meet without seams
  b.fillStyle = "#24272d"; // opaque, so overlapping cells do not stack into a grid
  for (let i = 0; i < M.backdrop.length; i += 2) b.fillRect(view.px(M.backdrop[i] * M.cell) - c / 2, view.py(M.backdrop[i + 1] * M.cell) - c / 2, c, c);
}
function mark(x, y, side, r) {
  ctx.beginPath();
  if (side === "CT") ctx.arc(x, y, r, 0, 2 * Math.PI);
  else { ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x + r * 1.1, y + r * 0.8); ctx.lineTo(x - r * 1.1, y + r * 0.8); ctx.closePath(); }
  ctx.fill(); ctx.stroke();
}
function draw() {
  if (!DATA.maps[mapI]) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!view || view.map !== mapI || view.w !== Math.round(r.width * dpr) || view.h !== Math.round(r.height * dpr)) layout();
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(backdrop, 0, 0);
  const sp = spotOf(hoverSpot) || spotOf(spot), which = (hoverSpot || spot || {}).which;
  const lit = sp ? new Set(sp.members) : null;
  const d = view.dpr;
  const order = rows.map((_, i) => i).sort((a, b) => (lit ? lit.has(a) - lit.has(b) : 0));
  for (const i of order) {
    const x = rows[i], on = !lit || lit.has(i);
    ctx.globalAlpha = on ? 1 : 0.15;
    ctx.strokeStyle = COLOR[x.g]; ctx.fillStyle = COLOR[x.g];
    if (x.v && x.a) {
      ctx.globalAlpha = on ? 0.5 : 0.08; ctx.lineWidth = d;
      ctx.beginPath(); ctx.moveTo(view.px(x.v[0]), view.py(x.v[1])); ctx.lineTo(view.px(x.a[0]), view.py(x.a[1])); ctx.stroke();
      ctx.globalAlpha = on ? 0.9 : 0.15;
      ctx.beginPath(); ctx.arc(view.px(x.a[0]), view.py(x.a[1]), 1.8 * d, 0, 2 * Math.PI); ctx.fill();
    }
  }
  for (const i of order) {
    const x = rows[i], on = !lit || lit.has(i);
    if (!x.v) continue;
    ctx.globalAlpha = on ? 1 : 0.2; ctx.fillStyle = COLOR[x.g]; ctx.strokeStyle = "#0e0f11"; ctx.lineWidth = 1.2 * d;
    mark(view.px(x.v[0]), view.py(x.v[1]), x.s, (i === hover || i === picked ? 7 : 4.5) * d);
  }
  ctx.globalAlpha = 1;
  if (sp) {
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5 * d; ctx.setLineDash([4 * d, 3 * d]);
    ctx.beginPath(); ctx.arc(view.px(sp.x), view.py(sp.y), Math.max(10 * d, SPOT_RADIUS * view.s), 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#ffffff"; ctx.font = `${12 * d}px Segoe UI, sans-serif`;
    ctx.fillText(`${which === "k" ? "K" : "D"}${(hoverSpot || spot).i + 1}`, view.px(sp.x) + 6 * d, view.py(sp.y) - 6 * d);
  }
}
function nearest(e) {
  const r = cv.getBoundingClientRect(), d = view.dpr, mx = (e.clientX - r.left) * d, my = (e.clientY - r.top) * d;
  let best = null, bd = (10 * d) ** 2;
  rows.forEach((x, i) => { if (!x.v) return; const q = (view.px(x.v[0]) - mx) ** 2 + (view.py(x.v[1]) - my) ** 2; if (q <= bd) { bd = q; best = i; } });
  return best;
}
function describe(x) {
  const M = DATA.maps[mapI], m = M.matches[x.m];
  const facing = x.f === null ? "unknown" : x.f ? "facing the killer" : "from behind";
  const how = x.k === "enemy" ? "" : ` · ${x.k === "team" ? "teamkill" : x.k}`;
  return { head: `${esc(M.map)} · ${esc(matchLabel(m))} · round ${x.r}`, body: `${x.s === "CT" ? "● CT" : "▲ T"} · ${esc(x.w)}${how} · ${x.d ? x.d.toFixed(1) + " m" : "–"} · ${x.hs ? "headshot" : "no headshot"} · ${facing}${x.o ? " · opening death" : ""}`,
    clip: x.clip !== undefined ? `<a href="index.html#clip=${x.clip}${x.t !== undefined ? "&t=" + x.t : ""}">clip ${x.clip}${x.t !== undefined ? " at " + x.t + " s" : ""}</a>` : "" };
}
function showDetail() {
  const el = $("detail");
  if (picked === null || !rows[picked]) { el.hidden = true; return; }
  const t = describe(rows[picked]);
  el.hidden = false;
  el.innerHTML = `<div><b>${t.head}</b></div><div>${t.body}</div>${t.clip ? `<div>${t.clip}</div>` : ""}`;
}
cv.onmousemove = (e) => {
  const i = nearest(e), tip = $("tip");
  if (i !== hover) { hover = i; draw(); }
  if (i === null) { tip.style.display = "none"; return; }
  const t = describe(rows[i]), r = cv.getBoundingClientRect();
  tip.innerHTML = `${t.head}<br>${t.body}${t.clip ? "<br>" + t.clip.replace(/<[^>]+>/g, "") : ""}`;
  tip.style.display = "block";
  const x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  tip.style.left = Math.min(x, r.width - tip.offsetWidth - 8) + "px"; tip.style.top = Math.min(y, r.height - tip.offsetHeight - 8) + "px";
};
cv.onmouseleave = () => { hover = null; $("tip").style.display = "none"; draw(); };
cv.onclick = (e) => { picked = nearest(e); showDetail(); draw(); };
window.onresize = () => draw();
render();
</script>
</body>
</html>
