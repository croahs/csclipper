<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>croclipper library</title>
<style>
  :root {
    --bg: #0e0f11;
    --surface: #15171a;
    --surface-2: #1c1f23;
    --line: #272a30;
    --text: #e6e8eb;
    --muted: #979da6;
    --accent: #f0a63a;
    --accent-ink: #1a1306;
    --accent-tint: rgba(240, 166, 58, 0.12);
    --radius: 6px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* Layout: sidebar | player | list; the list drops under the player on narrow windows. */
  .app {
    display: grid; height: 100dvh;
    grid-template-columns: 232px minmax(0, 1fr) 288px;
    grid-template-areas: "side main list";
  }
  aside.side { grid-area: side; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px 14px 24px; }
  main.main { grid-area: main; display: flex; flex-direction: column; min-width: 0; padding: 16px 20px; overflow: hidden; }
  section.list { grid-area: list; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 1180px) {
    .app { grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: "side main" "side list"; grid-template-rows: auto minmax(0, 1fr); }
    section.list { border-left: 0; border-top: 1px solid var(--line); }
    main.main { height: 64vh; } /* the player sizes itself to its area (size containment), so the area needs a height */
  }
  @media (max-width: 720px) {
    .app { display: block; height: auto; }
    aside.side { border-right: 0; border-bottom: 1px solid var(--line); }
    section.list { max-height: none; }
  }

  /* Sidebar */
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 4px; letter-spacing: 0.01em; }
  .run { font-size: 12px; color: var(--accent); margin: 0 0 12px; }
  .run[hidden] { display: none; }
  .stamp { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  label.field { display: grid; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  input[type="search"], select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 7px 9px; color: var(--text);
  }
  input[type="search"]::placeholder { color: #7d838c; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .group { margin: 18px 0 0; }
  .group h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .facet { display: grid; gap: 1px; }
  .facet button {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    width: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius);
    padding: 5px 8px; cursor: pointer; color: var(--text);
  }
  .facet button:hover { background: var(--surface-2); }
  .facet button[aria-pressed="true"] { background: var(--accent-tint); font-weight: 600; }
  .facet .count { color: var(--muted); font-size: 12px; }
  .facet .sub { color: var(--muted); font-size: 12px; }
  .facet.top { margin: 0 0 12px; }
  .facet.top button { font-weight: 600; }
  /* Delete / the command to delete, under the player */
  .act { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; }
  .act button { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; color: var(--text); font-size: 12px; }
  .act button.danger:hover { border-color: #b4483c; color: #f0b3a8; }
  .act code { font-size: 12px; color: var(--muted); }

  /* Player */
  .stage { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
  /* The player is as large as the area allows at 16:9, leaving room for the title line under it. */
  .col { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .frame { width: 100%; aspect-ratio: 16 / 9; background: #08090a; border-radius: var(--radius); overflow: hidden; }
  .frame video { display: block; width: 100%; height: 100%; background: #08090a; }
  @supports (width: 1cqw) {
    .stage { container-type: size; }
    .col { width: min(100cqw, calc((100cqh - 56px) * 16 / 9)); }
  }
  @media (max-width: 720px) { main.main { height: auto; } .stage { display: block; container-type: normal; } .col { width: 100%; } }
  .now { display: flex; align-items: baseline; gap: 12px; min-height: 44px; }
  .now .no { flex: none; font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); }
  .now .title { font-weight: 600; font-size: 16px; }
  .now .facts { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  @media (max-width: 1180px) { .hint { display: none; } }

  /* Clip list */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 10px 6px; color: var(--muted); font-size: 12px; }
  ol.rows { list-style: none; margin: 0; padding: 0 4px 12px; overflow-y: auto; flex: 1; min-height: 0; }
  /* One line per clip: number, title (truncated), score and length. */
  ol.rows li button {
    display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius); padding: 3px 6px; cursor: pointer; color: var(--text);
    font-size: 13px; line-height: 1.35;
  }
  ol.rows li button:hover { background: var(--surface-2); }
  ol.rows li button[aria-current="true"] { background: var(--accent-tint); }
  ol.rows .n { color: var(--muted); font-size: 12px; text-align: right; }
  ol.rows li button[aria-current="true"] .n { color: var(--accent); font-weight: 700; }
  ol.rows li button[aria-current="true"] .t { font-weight: 600; }
  ol.rows .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ol.rows .m { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  .empty { padding: 28px 16px; color: var(--muted); }
  .empty code { color: var(--text); }
  .empty button { margin-top: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) {
    .facet button, ol.rows li button { transition: background-color .15s ease; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Filters">
    <h1>Clips</h1>
    <div class="facet top"><button type="button" id="newest">Newest clips</button></div>
    <p class="run" id="run" hidden></p>
    <p class="stamp" id="stamp"></p>
    <label class="field">Find
      <input id="find" type="search" placeholder="Clip number or title" autocomplete="off">
    </label>
    <label class="field">Sort
      <select id="sort" autocomplete="off">
        <option value="score">Highest score</option>
        <option value="match">Newest match</option>
        <option value="added">Newest added</option>
        <option value="no">Clip number</option>
      </select>
    </label>
    <div class="group"><h2>Kind</h2><div class="facet" id="kinds"></div></div>
    <div class="group"><h2>Map</h2><div class="facet" id="maps"></div></div>
    <div class="group"><h2>Match</h2><div class="facet" id="matches"></div></div>
  </aside>

  <main class="main">
    <div class="stage">
      <div class="col">
        <div class="frame"><video id="player" controls playsinline preload="metadata"></video></div>
        <div class="now" id="now"></div>
      </div>
    </div>
  </main>

  <section class="list" aria-label="Clips">
    <div class="list-head"><span id="count"></span><span>Score / length</span></div>
    <ol class="rows" id="rows"></ol>
  </section>
</div>

<script type="application/json" id="clips">/*__CLIPS__*/[]</script>
<script>
  "use strict";
  const data = JSON.parse(document.getElementById("clips").textContent);
  const clips = data.clips || [];
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const KINDS = [["highlight", "Highlights"], ["deaths", "Deaths"], ["kills", "Kills"]];
  const mapName = (m) => (m || "unknown").replace(/^de_/, "");
  const dateOf = (c) => c.matchDate || c.createdAt;
  const day = (iso) => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

  // Matches: one per demo, newest first, labelled by date and map.
  const matches = new Map();
  for (const c of clips) {
    const m = matches.get(c.match) || { key: c.match, date: c.matchDate, dateFrom: c.dateFrom, map: c.map, n: 0 };
    m.n++; matches.set(c.match, m);
  }
  const matchList = [...matches.values()].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  // State. Controls are reset on every load: a browser restoring an old filter
  // must not leave the page looking empty.
  const state = { kind: null, map: null, match: null, current: null };
  $("find").value = ""; $("sort").value = "score";

  if (data.running) { $("run").hidden = false; $("run").textContent = "Run in progress: " + clips.length + " clips so far"; }
  $("stamp").textContent = "Updated " + new Date(data.generatedAt).toLocaleString();

  function facet(container, items, key) {
    container.replaceChildren();
    for (const [value, label, count, sub] of items) {
      const b = el("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state[key] === value));
      b.dataset.facet = key + ":" + value;
      const left = el("span", "", label);
      if (sub) { left.append(" "); left.append(el("span", "sub", sub)); }
      b.append(left, el("span", "count num", String(count)));
      b.addEventListener("click", () => {
        state[key] = state[key] === value ? null : value;
        render();
        // The facet buttons were rebuilt: keep keyboard focus on the one just used.
        const again = [...document.querySelectorAll("[data-facet]")].find((x) => x.dataset.facet === key + ":" + value);
        if (again) again.focus({ preventScroll: true });
      });
      container.append(b);
    }
  }

  function shown() {
    const q = $("find").value.trim().toLowerCase();
    const num = /^(clip\s*|#)?(\d+)$/.exec(q);
    const sort = $("sort").value;
    return clips
      .filter((c) => (!state.kind || c.kind === state.kind) && (!state.map || c.map === state.map) && (!state.match || c.match === state.match))
      .filter((c) => !q || (num ? c.no === Number(num[2]) : c.title.toLowerCase().includes(q)))
      .sort((a, b) => sort === "no" ? (a.no || 0) - (b.no || 0)
        : sort === "match" ? dateOf(b).localeCompare(dateOf(a)) || (a.round || 0) - (b.round || 0)
        : sort === "added" ? b.createdAt.localeCompare(a.createdAt)
        : (b.score ?? -1) - (a.score ?? -1));
  }

  function play(c, autoplay) {
    state.current = c ? c.id : null;
    const v = $("player");
    const now = $("now");
    now.replaceChildren();
    if (!c) { v.removeAttribute("src"); v.load(); return; }
    if (v.getAttribute("src") !== c.file) { v.src = c.file; }
    // Sound on. Browsers allow that only after a click or key press, so the first clip on load waits.
    if (autoplay) v.play().catch(() => {});
    now.append(el("span", "no num", String(c.no ?? "")));
    const text = el("div");
    text.append(el("div", "title", c.title));
    const facts = [c.score !== undefined ? "Score " + c.score : null, c.kills ? c.kills + " kills" : null, c.seconds.toFixed(1) + " s",
      c.clutch ? "1v" + c.clutch.vs + (c.clutch.won ? " won" : " lost") : null, ...(c.flags || []), day(dateOf(c))].filter(Boolean);
    text.append(el("div", "facts num", facts.join("  /  ")));
    const act = el("span", "act");
    if (served) {
      const del = el("button", "danger", "Delete clip " + c.no);
      del.type = "button";
      del.addEventListener("click", () => remove(c));
      act.append(del);
    } else {
      // From disk the page cannot delete: pnpm library serves it with a Delete button.
      const cmd = "pnpm drop " + c.no;
      const copy = el("button", "", "Copy");
      copy.type = "button";
      copy.addEventListener("click", () => { navigator.clipboard?.writeText(cmd).then(() => { copy.textContent = "Copied"; }, () => {}); });
      act.append(el("code", "", cmd), copy);
    }
    now.append(text, act);
    for (const b of document.querySelectorAll("#rows button")) b.setAttribute("aria-current", String(b.dataset.id === c.id));
    const cur = document.querySelector('#rows button[aria-current="true"]');
    if (cur) {
      cur.scrollIntoView({ block: "nearest" });
      // Focus follows the playing row when the list has it, so one row is marked, not two.
      if (document.activeElement && document.activeElement.closest("#rows")) cur.focus({ preventScroll: true });
    }
  }

  function render() {
    const list = shown();
    const kindCount = (k) => clips.filter((c) => c.kind === k).length;
    facet($("kinds"), KINDS.map(([k, label]) => [k, label, kindCount(k)]), "kind");
    const maps = [...new Set(clips.map((c) => c.map))].sort();
    facet($("maps"), maps.map((m) => [m, mapName(m), clips.filter((c) => c.map === m).length]), "map");
    facet($("matches"), matchList.map((m) => [m.key, m.date ? (m.dateFrom === "added" ? "added " + day(m.date) : day(m.date)) : "date unknown", m.n, mapName(m.map)]), "match");
    $("count").textContent = list.length === clips.length ? clips.length + " clips" : list.length + " of " + clips.length + " clips";

    const rows = $("rows");
    rows.replaceChildren();
    if (!clips.length) {
      const e = el("li", "empty");
      e.append("No clips yet. Drop demos into ", el("code", "", "demos/inbox"), " and run ", el("code", "", "pnpm go"), ".");
      rows.append(e);
    } else if (!list.length) {
      const e = el("li", "empty", "No clips match these filters.");
      const clear = el("button", "", "Clear filters");
      clear.type = "button";
      clear.addEventListener("click", () => { state.kind = state.map = state.match = null; $("find").value = ""; render(); });
      e.append(el("br"), clear);
      rows.append(e);
    }
    for (const c of list) {
      const li = el("li");
      const b = el("button");
      b.type = "button";
      b.dataset.id = c.id;
      b.append(el("span", "n num", String(c.no ?? "")), el("span", "t", c.title),
        el("span", "m num", (c.score !== undefined ? c.score.toFixed(0) + "  " : "") + c.seconds.toFixed(0) + " s"));
      b.addEventListener("click", () => play(c, true));
      li.append(b);
      rows.append(li);
    }
    // Keep the playing clip if it is still listed, else show the first one.
    const keep = list.find((c) => c.id === state.current);
    play(keep || list[0] || null, false);
  }

  // Served by pnpm library (http) the page can delete; opened from disk it cannot.
  const served = location.protocol === "http:" && /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  async function remove(c) {
    if (!c || !confirm("Delete clip " + c.no + "?\n" + c.title + "\n\nThe file goes to library/trash and the moment is never made again.")) return;
    const r = await fetch("/delete/" + c.no, { method: "POST" }).catch((e) => ({ ok: false, statusText: String(e) }));
    if (!r.ok) { alert("Not deleted: " + (r.statusText || r.status)); return; }
    // Play the next clip in the list, then drop this one from the page.
    const list = shown();
    const i = list.findIndex((x) => x.id === c.id);
    const next = list[i + 1] || list[i - 1] || null;
    clips.splice(clips.findIndex((x) => x.id === c.id), 1);
    state.current = next ? next.id : null;
    render();
    if (next) play(next, true);
  }

  function step(d) {
    const list = shown();
    if (!list.length) return;
    const i = list.findIndex((c) => c.id === state.current);
    play(list[Math.min(list.length - 1, Math.max(0, (i < 0 ? 0 : i + d)))], true);
  }
  document.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.altKey || e.ctrlKey || e.metaKey) return;
    // On the focused player the arrows seek, as players do; j / k still step.
    const arrows = !(e.target instanceof HTMLVideoElement);
    if (e.key === "Delete" && served) { e.preventDefault(); remove(clips.find((c) => c.id === state.current)); return; }
    if ((arrows && e.key === "ArrowRight") || e.key === "j") { e.preventDefault(); step(1); }
    else if ((arrows && e.key === "ArrowLeft") || e.key === "k") { e.preventDefault(); step(-1); }
  });
  $("newest").addEventListener("click", () => {
    state.kind = state.map = state.match = null; $("find").value = ""; $("sort").value = "added";
    render();
    const first = shown()[0];
    if (first) play(first, true);
  });
  $("find").addEventListener("input", render);
  $("sort").addEventListener("input", render);
  // Keep pages restored from the back/forward cache consistent with the reset controls.
  window.addEventListener("pageshow", (e) => { if (e.persisted) { $("find").value = ""; $("sort").value = "score"; state.kind = state.map = state.match = null; render(); } });
  render();
</script>
</body>
</html>
