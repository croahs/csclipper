<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>croclipper library</title>
<!-- The tab icon, inline so it also shows when the page is opened from disk. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171a'/%3E%3Cpath d='M3 16Q16 3 29 16 16 29 3 16z' fill='%23f0a63a'/%3E%3Cellipse cx='16' cy='16' rx='2.4' ry='8' fill='%2315171a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e0f11;
    --surface: #15171a;
    --surface-2: #1c1f23;
    --line: #272a30;
    --text: #e6e8eb;
    --muted: #979da6;
    --accent: #f0a63a;
    --accent-ink: #1a1306;
    --accent-tint: rgba(240, 166, 58, 0.12);
    --radius: 6px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* Layout: sidebar | player | list; the list drops under the player on narrow windows. */
  .app {
    display: grid; height: 100dvh;
    grid-template-columns: 232px minmax(0, 1fr) 288px;
    grid-template-areas: "side main list";
  }
  aside.side { grid-area: side; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px 14px 24px; }
  main.main { grid-area: main; display: flex; flex-direction: column; min-width: 0; padding: 16px 20px; overflow: hidden; }
  section.list { grid-area: list; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 1180px) {
    .app { grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: "side main" "side list"; grid-template-rows: auto minmax(0, 1fr); }
    section.list { border-left: 0; border-top: 1px solid var(--line); }
    main.main { height: 64vh; } /* the player sizes itself to its area (size containment), so the area needs a height */
  }
  @media (max-width: 720px) {
    .app { display: block; height: auto; }
    aside.side { border-right: 0; border-bottom: 1px solid var(--line); }
    section.list { max-height: none; }
  }

  /* Sidebar */
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 4px; letter-spacing: 0.01em; }
  .run { font-size: 12px; color: var(--accent); margin: 0 0 12px; }
  .run[hidden] { display: none; }
  .stamp { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  label.field { display: grid; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  input[type="search"], select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 7px 9px; color: var(--text);
  }
  input[type="search"]::placeholder { color: #7d838c; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .group { margin: 18px 0 0; }
  .group h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .facet { display: grid; gap: 1px; }
  .facet button {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    width: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius);
    padding: 5px 8px; cursor: pointer; color: var(--text);
  }
  .facet button:hover { background: var(--surface-2); }
  .facet button[aria-pressed="true"] { background: var(--accent-tint); font-weight: 600; }
  .facet .count { color: var(--muted); font-size: 12px; }
  .facet .sub { color: var(--muted); font-size: 12px; }
  .facet.top { margin: 0 0 12px; }
  .facet.top button { font-weight: 600; }
  .group[hidden] { display: none; }
  .facet button.more { color: var(--muted); font-size: 12px; }
  .sg { color: var(--accent); }
  /* Star: a quiet control under the player and at the end of each list row */
  .act button.star[aria-pressed="true"] { color: var(--accent); border-color: rgba(240, 166, 58, 0.45); }
  .act .grp .sg { font-size: 13px; }
  /* Film: the first control in the row, the primary one (pnpm film masters makes edit-grade files of the
     picked clips). Not picked: an outlined "+ Add to film"; picked: filled in the accent with a check, as
     the film picker's card footer. */
  .act button.filmtog { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; padding: 4px 12px 4px 9px; border-color: rgba(240, 166, 58, 0.45); color: var(--text); }
  .act button.filmtog .ic { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid currentColor; font-size: 11px; line-height: 1; }
  .act button.filmtog:hover { background: #23272c; }
  /* :not(.star) outranks the row's generic pressed-button tint below */
  .act button.filmtog[aria-pressed="true"]:not(.star) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .act button.filmtog[aria-pressed="true"]:not(.star):hover { background: #f4b45a; }
  .act button.filmtog[aria-pressed="true"] .ic { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
  .act button.filmtog .unsaved { font-weight: 400; font-size: 11px; opacity: 0.85; }
  /* The list's film mark: a filled accent tag before the clip number */
  ol.rows .fmark { display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); margin-right: 4px; vertical-align: 1px; }
  .list-head .fcount { color: var(--accent); }
  /* Bottom dock: a film save that failed; from disk, the film changes as commands to copy */
  .dock { position: fixed; right: 300px; left: 244px; bottom: 12px; z-index: 5; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  @media (max-width: 1180px) { .dock { right: 12px; left: 232px; } }
  @media (max-width: 720px) { .dock { left: 8px; right: 8px; bottom: 8px; } }
  .dock > * { pointer-events: auto; width: min(720px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); font-size: 12px; }
  .dock [hidden] { display: none !important; }
  .dock .perr { color: #f0b3a8; border-color: #6b3a33; }
  .dock .pending { border-color: rgba(240, 166, 58, 0.45); display: grid; gap: 6px; }
  .pending .what { color: var(--muted); }
  .pending .what b { color: var(--accent); }
  .pending .cmd { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pending .cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 4px 8px; background: var(--bg); border-radius: 4px; color: var(--text); }
  .pending .cmd button { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .pending .how { color: var(--muted); }
  .pending .how a { color: var(--text); }
  body.has-pending ol.rows { padding-bottom: 150px; }
  /* Share and Delete / the commands for them, under the player */
  .act { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; }
  .act .grp { display: inline-flex; align-items: center; gap: 8px; }
  .act .note { font-size: 12px; color: var(--muted); }
  .act .note.err { color: #f0b3a8; white-space: normal; max-width: 40ch; }
  .act button { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; color: var(--text); font-size: 12px; }
  .act button.danger:hover { border-color: #b4483c; color: #f0b3a8; }
  .act code { font-size: 12px; color: var(--muted); }
  /* Share, Vertical and Trim: one joined group, so the row stays short */
  .act .seg { display: inline-flex; }
  .act .seg button { border-radius: 0; margin-left: -1px; }
  .act .seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
  .act .seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .act button[aria-pressed="true"]:not(.star) { background: var(--accent-tint); border-color: rgba(240, 166, 58, 0.45); position: relative; }
  /* What Share, Vertical and Save cut made (or, from disk, their commands): one line under the title */
  .out { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 16px; }
  .out:empty { display: none; }
  .out .act { margin-left: 0; }
  .out .what { font-size: 12px; color: var(--muted); }
  .facet a.dmap { display: block; padding: 5px 8px; border-radius: var(--radius); color: var(--text); text-decoration: none; font-weight: 600; }
  .facet a.dmap:hover { background: var(--surface-2); }
  .facet a.dmap[hidden] { display: none; }

  /* Trim: the clip's timeline under the player, two handles, the selection in the accent tint */
  .trim[hidden] { display: none; }
  .trim { display: grid; gap: 6px; user-select: none; }
  .track { position: relative; height: 26px; cursor: pointer; touch-action: none; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--line); }
  .track .sel { position: absolute; top: 5px; height: 16px; background: var(--accent-tint); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); }
  .track .head { position: absolute; top: 3px; width: 2px; height: 20px; margin-left: -1px; background: var(--text); opacity: 0.6; pointer-events: none; }
  .track .hd { position: absolute; top: 1px; width: 12px; height: 24px; margin-left: -6px; border-radius: 3px; background: var(--accent); border: 2px solid var(--bg); cursor: ew-resize; }
  .track .hd:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .trow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .trow .tlen { font-size: 12px; color: var(--muted); }
  .trow .tlen b { color: var(--text); font-weight: 600; }
  .trow .act { gap: 8px; }
  .trow button:disabled { opacity: 0.5; cursor: default; }

  /* Player */
  .stage { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
  /* The player is as large as the area allows at 16:9, leaving room for the title line under it. */
  .col { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .frame { width: 100%; aspect-ratio: 16 / 9; background: #08090a; border-radius: var(--radius); overflow: hidden; }
  .frame video { display: block; width: 100%; height: 100%; background: #08090a; }
  @supports (width: 1cqw) {
    .stage { container-type: size; }
    /* --below: the trim bar and the output line when shown (set by fit()) */
    .col { width: min(100cqw, calc((100cqh - 56px - var(--below, 0px)) * 16 / 9)); }
  }
  @media (max-width: 720px) { main.main { height: auto; } .stage { display: block; container-type: normal; } .col { width: 100%; } }
  .now { display: flex; align-items: baseline; gap: 12px; min-height: 44px; }
  .now .no { flex: none; font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); }
  .now .title { font-weight: 600; font-size: 16px; }
  .now .facts { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  @media (max-width: 1180px) { .hint { display: none; } }

  /* Clip list */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 10px 6px; color: var(--muted); font-size: 12px; }
  ol.rows { list-style: none; margin: 0; padding: 0 4px 12px; overflow-y: auto; flex: 1; min-height: 0; }
  /* One line per clip: number, title (truncated), score and length. */
  ol.rows li.row { display: grid; grid-template-columns: minmax(0, 1fr) 22px; align-items: center; }
  ol.rows li button.pick {
    display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius); padding: 3px 6px; cursor: pointer; color: var(--text);
    font-size: 13px; line-height: 1.35;
  }
  ol.rows li button.pick:hover { background: var(--surface-2); }
  ol.rows li button.pick[aria-current="true"] { background: var(--accent-tint); }
  ol.rows .n { color: var(--muted); font-size: 12px; text-align: right; }
  ol.rows li button.pick[aria-current="true"] .n { color: var(--accent); font-weight: 700; }
  ol.rows li button.pick[aria-current="true"] .t { font-weight: 600; }
  /* Starred rows show a filled star; an unstarred row's star shows on hover or focus (served only). */
  ol.rows .rstar { display: grid; place-items: center; width: 22px; height: 22px; font-size: 13px; line-height: 1; color: var(--accent); background: none; border: 0; border-radius: var(--radius); padding: 0; }
  ol.rows button.rstar { cursor: pointer; }
  ol.rows button.rstar[aria-pressed="false"] { color: var(--muted); opacity: 0; }
  ol.rows li.row:hover button.rstar, ol.rows button.rstar:focus-visible { opacity: 1; }
  ol.rows button.rstar:hover { background: var(--surface-2); }
  ol.rows .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ol.rows .m { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  .empty { padding: 28px 16px; color: var(--muted); }
  .empty code { color: var(--text); }
  .empty button { margin-top: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) {
    .facet button, ol.rows li button { transition: background-color .15s ease, opacity .15s ease; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Filters">
    <h1>Clips</h1>
    <div class="facet top"><button type="button" id="newest">Newest clips</button><a class="dmap" id="deathmap" href="deaths.html" hidden>Death map</a><a class="dmap" href="film.html" title="Go through the film clips and pick the ones for the film">Film picker</a></div>
    <p class="run" id="run" hidden></p>
    <p class="stamp" id="stamp"></p>
    <label class="field">Find
      <input id="find" type="search" placeholder="Clip number or title" autocomplete="off">
    </label>
    <label class="field">Sort
      <select id="sort" autocomplete="off">
        <option value="score">Highest score</option>
        <option value="match">Newest match</option>
        <option value="added">Newest added</option>
        <option value="no">Clip number</option>
      </select>
    </label>
    <div class="group"><div class="facet" id="starred"></div><div class="facet" id="picked"></div></div>
    <div class="group"><h2>Kind</h2><div class="facet" id="kinds"></div></div>
    <div class="group" id="players-g" hidden><h2>Player</h2><div class="facet" id="players"></div></div>
    <div class="group" id="feats-g"><h2>Feats</h2><div class="facet" id="feats"></div></div>
    <div class="group" id="weapons-g"><h2>Weapon</h2><div class="facet" id="weapons"></div></div>
    <div class="group"><h2>Map</h2><div class="facet" id="maps"></div></div>
    <div class="group"><h2>Match</h2><div class="facet" id="matches"></div></div>
  </aside>

  <main class="main">
    <div class="stage">
      <div class="col">
        <div class="frame"><video id="player" controls playsinline preload="metadata"></video></div>
        <div class="trim" id="trim" hidden>
          <div class="track" id="track">
            <div class="sel" id="tsel"></div>
            <div class="head" id="thead"></div>
            <div class="hd" id="tin" role="slider" tabindex="0" aria-label="Cut starts at"></div>
            <div class="hd" id="tout" role="slider" tabindex="0" aria-label="Cut ends at"></div>
          </div>
          <div class="trow"><span class="tlen num" id="tlen"></span><span class="act" id="tact"></span></div>
        </div>
        <div class="now" id="now"></div>
        <div class="out" id="out"></div>
      </div>
    </div>
  </main>

  <section class="list" aria-label="Clips">
    <div class="list-head"><span id="count"></span><span>Score / length</span></div>
    <ol class="rows" id="rows"></ol>
  </section>
</div>

<div class="dock">
  <div class="perr" id="perr" role="alert" hidden></div>
  <div class="pending" id="pending" hidden>
    <div class="what" id="pending-what"></div>
    <div class="cmd" id="cmd-pick"><code></code><button type="button">Copy</button></div>
    <div class="cmd" id="cmd-unpick"><code></code><button type="button">Copy</button></div>
    <div class="how">Open the library through <code>pnpm library</code> (<a href="http://127.0.0.1:8765/">http://127.0.0.1:8765/</a>) and the film button saves directly.</div>
  </div>
</div>

<script type="application/json" id="clips">/*__CLIPS__*/[]</script>
<script>
  "use strict";
  const data = JSON.parse(document.getElementById("clips").textContent);
  const clips = data.clips || [];
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  // Bloopers (pnpm film) are listed only when the library has one, so a library without any looks as it always did.
  const KINDS = [["highlight", "Highlights"], ["deaths", "Deaths"], ["kills", "Kills"], ["blooper", "Bloopers"]];
  // Player (pnpm film): "me" = the main account's clips (no player); a povKey = a friend's, labelled with the
  // name on that player's newest clip (page.ts). Absent from the data when no clip has a player.
  const PLAYERS = data.players || [];
  const playerOf = (c) => c.player || "me";
  const mapName = (m) => (m || "unknown").replace(/^de_/, "");
  const dateOf = (c) => c.matchDate || c.createdAt;
  const day = (iso) => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

  // Matches: one per demo, newest first, labelled by date and map.
  const matches = new Map();
  for (const c of clips) {
    const m = matches.get(c.match) || { key: c.match, date: c.matchDate, dateFrom: c.dateFrom, map: c.map, n: 0 };
    m.n++; matches.set(c.match, m);
  }
  const matchList = [...matches.values()].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  // State. Controls are reset on every load: a browser restoring an old filter
  // must not leave the page looking empty.
  const state = { kind: null, player: null, map: null, match: null, star: null, pick: null, feat: null, weapon: null, moreWeapons: false, current: null };
  $("find").value = ""; $("sort").value = "score";
  // Every filter off and Find empty; the sort is the caller's.
  function clearFilters() { state.kind = state.player = state.map = state.match = state.star = state.pick = state.feat = state.weapon = null; state.moreWeapons = false; $("find").value = ""; }

  // Stars: clip numbers. Inlined when the page was written; served, refreshed from the server on load.
  const starred = new Set(data.stars || []);
  // Served by pnpm library (http) the page can delete, star and save film picks; opened from disk it cannot.
  const served = location.protocol === "http:" && /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  // Film picks: the store the film picker shares (src/library/pick-store.js, inlined by page.ts): the
  // server's last answer with the changes in flight replayed; from disk, the inlined picks plus the
  // changes made here, which the pending bar lists as commands. Absent from the data when none is picked.
  const createPickStore = /*__PICKSTORE__*/null;
  const pickStore = createPickStore({ served, initial: data.picks || [], onChange: () => pickChanged(), onError: (t) => { $("perr").hidden = !t; $("perr").textContent = t; } });
  const picked = pickStore.all();
  const FEATS = data.featLabels || [];
  const WEAPONS_SHOWN = 6; // the rest behind "More"

  if (data.running) { $("run").hidden = false; $("run").textContent = "Run in progress: " + clips.length + " clips so far"; }
  $("stamp").textContent = "Updated " + new Date(data.generatedAt).toLocaleString();

  function facet(container, items, key) {
    container.replaceChildren();
    for (const [value, label, count, sub] of items) {
      const b = el("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state[key] === value));
      b.dataset.facet = key + ":" + value;
      const left = el("span", "", label);
      if (sub) { left.append(" "); left.append(el("span", "sub", sub)); }
      b.append(left, el("span", "count num", String(count)));
      b.addEventListener("click", () => {
        state[key] = state[key] === value ? null : value;
        // Reels have no score: picking deaths or kills sorts by newest match, anything else by score.
        if (key === "kind") $("sort").value = state.kind === "deaths" || state.kind === "kills" ? "match" : "score";
        render();
        // The facet buttons were rebuilt: keep keyboard focus on the one just used.
        const again = [...document.querySelectorAll("[data-facet]")].find((x) => x.dataset.facet === key + ":" + value);
        if (again) again.focus({ preventScroll: true });
      });
      container.append(b);
    }
  }

  function shown() {
    const q = $("find").value.trim().toLowerCase();
    const num = /^(clip\s*|#)?(\d+)$/.exec(q);
    const sort = $("sort").value;
    return clips
      .filter((c) => (!state.kind || c.kind === state.kind) && (!state.player || playerOf(c) === state.player) && (!state.map || c.map === state.map) && (!state.match || c.match === state.match))
      .filter((c) => (!state.star || starred.has(c.no)) && (!state.pick || picked.has(c.no) || c.id === state.current) /* the playing clip stays listed when it is taken out of the film: it leaves with the next step, and a failed save changes nothing */ && (!state.feat || (c.feats || []).includes(state.feat)) && (!state.weapon || (c.weapons || []).includes(state.weapon)))
      .filter((c) => !q || (num ? c.no === Number(num[2]) : c.title.toLowerCase().includes(q)))
      .sort((a, b) => sort === "no" ? (a.no || 0) - (b.no || 0)
        : sort === "match" ? dateOf(b).localeCompare(dateOf(a)) || (a.round || 0) - (b.round || 0)
        : sort === "added" ? b.createdAt.localeCompare(a.createdAt)
        : (b.score ?? -1) - (a.score ?? -1));
  }

  function play(c, autoplay) {
    // The trim bar belongs to one clip: another clip closes it.
    if (trim.open && (!c || c.id !== trim.id)) closeTrim();
    state.current = c ? c.id : null;
    const v = $("player");
    const now = $("now");
    now.replaceChildren();
    if (!c) { v.removeAttribute("src"); v.load(); drawOut(); return; }
    if (v.getAttribute("src") !== c.file) { v.src = c.file; }
    // Sound on. Browsers allow that only after a click or key press, so the first clip on load waits.
    if (autoplay) v.play().catch(() => {});
    now.append(el("span", "no num", String(c.no ?? "")));
    const text = el("div");
    text.append(el("div", "title", c.title));
    const facts = [c.score !== undefined ? (c.kind === "blooper" ? "Blooper score " : "Score ") + c.score : null, c.kills ? c.kills + " kills" : null, c.seconds.toFixed(1) + " s",
      c.clutch ? "1v" + c.clutch.vs + (c.clutch.won ? " won" : " lost") : null, ...(c.flags || []), day(dateOf(c))].filter(Boolean);
    text.append(el("div", "facts num", facts.join("  /  ")));
    const act = el("span", "act");
    act.id = "act";
    act.append(filmControl(c), starControl(c), exportGroup(c));
    if (served) {
      const del = el("button", "danger", "Delete clip " + c.no);
      del.type = "button";
      del.addEventListener("click", () => remove(c));
      act.append(del);
    } else {
      // From disk the page cannot delete: pnpm library serves it with a Delete button.
      const cmd = "pnpm drop " + c.no;
      const grp = el("span", "grp");
      grp.append(el("code", "", cmd), copyButton("Copy", cmd));
      act.append(grp);
    }
    now.append(text, act);
    drawOut();
    for (const b of document.querySelectorAll("#rows button.pick")) b.setAttribute("aria-current", String(b.dataset.id === c.id));
    const cur = document.querySelector('#rows button.pick[aria-current="true"]');
    if (cur) {
      cur.scrollIntoView({ block: "nearest" });
      // Focus follows the playing row when the list has it, so one row is marked, not two.
      if (document.activeElement && document.activeElement.closest("#rows")) cur.focus({ preventScroll: true });
    }
  }

  function render() {
    const list = shown();
    const kindCount = (k) => clips.filter((c) => c.kind === k).length;
    facet($("starred"), [[true, "★ Starred", clips.filter((c) => starred.has(c.no)).length]], "star");
    facet($("picked"), [[true, "Film picks", clips.filter((c) => picked.has(c.no)).length]], "pick");
    facet($("kinds"), KINDS.filter(([k]) => k !== "blooper" || kindCount(k)).map(([k, label]) => [k, label, kindCount(k)]), "kind");
    facet($("players"), PLAYERS.map((p) => [p.key, p.name, clips.filter((c) => playerOf(c) === p.key).length]).filter((p) => p[2] > 0 || state.player === p[0]), "player");
    $("players-g").hidden = !PLAYERS.length;
    // Feats and weapons come from the highlight's moment, a blooper's feat from its type (page.ts); a group with nothing in it is hidden.
    const feats = FEATS.map(([k, label]) => [k, label, clips.filter((c) => (c.feats || []).includes(k)).length]).filter((f) => f[2] > 0);
    facet($("feats"), feats, "feat");
    $("feats-g").hidden = !feats.length;
    const wc = new Map();
    for (const c of clips) for (const w of c.weapons || []) wc.set(w, (wc.get(w) || 0) + 1);
    const weapons = [...wc].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([w, n]) => [w, w, n]);
    const hidden = weapons.length - WEAPONS_SHOWN;
    facet($("weapons"), hidden > 0 && !state.moreWeapons ? weapons.filter((w, i) => i < WEAPONS_SHOWN || w[0] === state.weapon) : weapons, "weapon");
    if (hidden > 0) {
      const more = el("button", "more", state.moreWeapons ? "Fewer" : "More (" + hidden + ")");
      more.type = "button";
      more.addEventListener("click", () => { state.moreWeapons = !state.moreWeapons; render(); $("weapons").querySelector(".more").focus({ preventScroll: true }); });
      $("weapons").append(more);
    }
    $("weapons-g").hidden = !weapons.length;
    const maps = [...new Set(clips.map((c) => c.map))].sort();
    facet($("maps"), maps.map((m) => [m, mapName(m), clips.filter((c) => c.map === m).length]), "map");
    facet($("matches"), matchList.map((m) => [m.key, m.date ? (m.dateFrom === "added" ? "added " + day(m.date) : day(m.date)) : "date unknown", m.n, mapName(m.map)]), "match");
    $("count").replaceChildren(list.length === clips.length ? clips.length + " clips" : list.length + " of " + clips.length + " clips",
      el("span", "fcount", " · " + clips.filter((c) => picked.has(c.no)).length + " in the film"));

    const rows = $("rows");
    rows.replaceChildren();
    if (!clips.length) {
      const e = el("li", "empty");
      e.append("No clips yet. Drop demos into ", el("code", "", "demos/inbox"), " and run ", el("code", "", "pnpm go"), ".");
      rows.append(e);
    } else if (!list.length) {
      const e = el("li", "empty", "No clips match these filters.");
      const clear = el("button", "", "Clear filters");
      clear.type = "button";
      clear.addEventListener("click", () => { clearFilters(); render(); });
      e.append(el("br"), clear);
      rows.append(e);
    }
    for (const c of list) {
      const li = el("li", "row");
      const b = el("button", "pick");
      b.type = "button";
      b.dataset.id = c.id;
      const n = el("span", "n num");
      if (picked.has(c.no)) { const m = el("span", "fmark"); m.setAttribute("role", "img"); m.setAttribute("aria-label", "In the film"); m.title = "In the film"; n.append(m); }
      n.append(String(c.no ?? ""));
      b.append(n, el("span", "t", c.title),
        el("span", "m num", (c.score !== undefined ? c.score.toFixed(0) + "  " : "") + c.seconds.toFixed(0) + " s"));
      b.addEventListener("click", () => play(c, true));
      const on = starred.has(c.no);
      let s;
      if (served) {
        // Served the row's star toggles; from disk it only shows the state (the player's control has the command).
        s = el("button", "rstar", on ? "★" : "☆");
        s.type = "button";
        s.dataset.id = c.id;
        s.setAttribute("aria-pressed", String(on));
        s.setAttribute("aria-label", (on ? "Unstar" : "Star") + " clip " + c.no);
        s.title = on ? "Starred (s)" : "Star (s)";
        s.addEventListener("click", () => toggleStar(c, true));
      } else {
        s = el("span", "rstar", on ? "★" : "");
        if (on) s.setAttribute("aria-label", "starred");
      }
      li.append(b, s);
      rows.append(li);
    }
    // Keep the playing clip if it is still listed, else show the first one.
    const keep = list.find((c) => c.id === state.current);
    play(keep || list[0] || null, false);
  }

  async function remove(c) {
    if (!c || !confirm("Delete clip " + c.no + "?\n" + c.title + "\n\nThe file goes to library/trash and the moment is never made again.")) return;
    const r = await fetch("/delete/" + c.no, { method: "POST" }).catch((e) => ({ ok: false, statusText: String(e) }));
    if (!r.ok) { alert("Not deleted: " + (r.statusText || r.status)); return; }
    // Play the next clip in the list, then drop this one from the page.
    const list = shown();
    const i = list.findIndex((x) => x.id === c.id);
    const next = list[i + 1] || list[i - 1] || null;
    clips.splice(clips.findIndex((x) => x.id === c.id), 1);
    state.current = next ? next.id : null;
    render();
    if (next) play(next, true);
  }

  // Copy that also works opened from disk, where the async clipboard API may be missing or refused:
  // then a hidden textarea and execCommand("copy").
  function copyText(text) {
    const fallback = () => {
      const t = el("textarea");
      t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.append(t); t.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      t.remove();
      return ok ? Promise.resolve() : Promise.reject(new Error("copy refused"));
    };
    return navigator.clipboard && window.isSecureContext ? navigator.clipboard.writeText(text).catch(fallback) : fallback();
  }
  function copyButton(label, text) {
    const b = el("button", "", label);
    b.type = "button";
    b.addEventListener("click", () => copyText(text).then(() => { b.textContent = "Copied"; setTimeout(() => { b.textContent = label; }, 1500); }, () => { b.textContent = "Copy failed"; }));
    return b;
  }

  // Share, Vertical and Trim: one joined group in the action row. Served, Share and Vertical ask
  // the server to make library/share/ and library/vertical/ copies, Trim opens the trim bar whose
  // Save cut makes library/cuts/<no>-<title>_<from>-<to>.mp4; what they made, or are making, shows
  // on one line under the title (#out). From disk, Share and Vertical show their pnpm commands on
  // that line, and the trim bar shows the pnpm cut command.
  // jobs: "share:<no>", "vertical:<no>", "cut:<no>" -> { since } while it runs, { result } or { error }
  // after, for this page view. shown: from disk, the commands opened ("share:<no>", "vertical:<no>").
  const jobs = new Map();
  const opened = new Set();
  const mb = (bytes) => (bytes / 1048576).toFixed(1) + " MB";
  const KIND_LABEL = { share: "Share", vertical: "Vertical", cut: "Cut" };
  function exportGroup(c) {
    const seg = el("span", "seg");
    for (const kind of ["share", "vertical", "trim"]) {
      const b = el("button", "", kind === "trim" ? "Trim" : KIND_LABEL[kind]);
      b.type = "button";
      b.dataset.kind = kind;
      if (kind === "trim") {
        b.title = "Cut a shorter copy (i / o set in and out)";
        b.setAttribute("aria-pressed", String(trim.open && trim.id === c.id));
        b.addEventListener("click", () => { if (trim.open) closeTrim(); else openTrim(c); });
      } else if (served) {
        b.title = kind === "share" ? "An H.264 copy under the upload limit" : "A 9:16 copy for Reels, TikTok and Shorts";
        b.addEventListener("click", () => make(c, kind));
      } else {
        b.setAttribute("aria-pressed", String(opened.has(kind + ":" + c.no)));
        b.addEventListener("click", () => { const k = kind + ":" + c.no; if (opened.has(k)) opened.delete(k); else opened.add(k); b.setAttribute("aria-pressed", String(opened.has(k))); drawOut(); });
      }
      seg.append(b);
    }
    return seg;
  }
  function revealButton(path) {
    const b = el("button", "", "Show in folder");
    b.type = "button";
    b.addEventListener("click", () => fetch(path, { method: "POST" }).catch(() => {}));
    return b;
  }
  function commandLine(cmd, caption) {
    const grp = el("span", "act");
    grp.append(el("code", "", cmd), copyButton("Copy", cmd));
    if (caption) grp.append(copyButton("Copy caption", caption));
    return grp;
  }
  // The output line of the clip on screen (the clip may have changed while an encode ran).
  function drawOut() {
    const out = $("out");
    out.replaceChildren();
    const c = clips.find((x) => x.id === state.current);
    if (c) {
      if (!served) {
        if (opened.has("share:" + c.no)) out.append(commandLine("pnpm share " + c.no, c.caption));
        if (opened.has("vertical:" + c.no)) out.append(commandLine("pnpm vertical " + c.no, c.caption));
      } else for (const kind of ["share", "vertical", "cut"]) {
        const s = jobs.get(kind + ":" + c.no);
        if (!s) continue;
        const line = el("span", "act");
        line.append(el("span", "what", KIND_LABEL[kind]));
        if (s.since) line.append(el("span", "note busy", (kind === "cut" ? "Making the cut " + s.from + "-" + s.to + " s... " : "Making the " + kind + " file... ") + Math.round((Date.now() - s.since) / 1000) + " s"));
        else if (s.error) {
          line.append(el("span", "note err", s.error));
          if (kind !== "cut") { const again = el("button", "", "Try again"); again.type = "button"; again.addEventListener("click", () => make(c, kind)); line.append(again); }
        } else {
          const r = s.result;
          const name = r.file.split("/").pop();
          line.append(el("span", "note", name + "  " + mb(r.bytes) + (r.seconds ? "  " + r.seconds.toFixed(1) + " s" : "") + (r.reused ? "  (already made)" : "")));
          if (kind === "share") line.append(copyButton("Copy caption", r.caption));
          line.append(revealButton("/reveal/" + c.no + (kind === "share" ? "" : kind === "vertical" ? "/vertical" : "/cut/" + encodeURIComponent(name))));
        }
        out.append(line);
      }
    }
    fit();
  }
  // The player leaves room for the trim bar and the output line, so nothing is pushed off screen.
  function fit() {
    const below = (trim.open ? $("trim").offsetHeight + 10 : 0) + ($("out").childElementCount ? $("out").offsetHeight + 10 : 0);
    document.querySelector(".col").style.setProperty("--below", below + "px");
  }
  // Served: POST /share/<no>, /vertical/<no>, or /cut/<no> with { from, to }; the server runs the
  // pnpm command in a child process, and a second identical request joins the running one.
  async function make(c, kind, body) {
    const key = kind + ":" + c.no;
    if (jobs.get(key)?.since) return;
    jobs.set(key, Object.assign({ since: Date.now() }, body || {}));
    drawOut();
    let next;
    try {
      const r = await fetch("/" + kind + "/" + c.no, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : { method: "POST" });
      const res = await r.json().catch(() => ({}));
      next = r.ok ? { result: res } : { error: res.error || r.statusText || String(r.status) };
    } catch (e) { next = { error: String(e) }; }
    jobs.set(key, next);
    drawOut();
    if (kind === "cut") drawTrim();
  }

  // Trim: the clip's timeline under the player with an in and an out handle, dragged or nudged
  // (arrows: a frame, shift: 1 s; i / o: in / out at the playing position). Playback loops inside
  // the selection while the bar is open. The library clip is never changed: Save cut makes a copy.
  const FRAME = 1 / 60; // library clips are rendered at config.json render.fps, 60
  const MIN_CUT = 1, WHOLE = 0.1; // as pnpm cut refuses: under 1 s, or within 0.1 s of both ends
  const trim = { open: false, id: null, from: 0, to: 0, drag: null };
  const snap = (t) => Math.round(t / FRAME) * FRAME;
  const secs = (t) => String(+t.toFixed(3)); // as the command takes them
  function clipLength(c) { const d = $("player").duration; return Number.isFinite(d) && d > 0 ? d : c.seconds; }
  function trimClip() { return clips.find((x) => x.id === trim.id); }
  function openTrim(c) {
    trim.open = true; trim.id = c.id;
    const d = clipLength(c);
    trim.from = 0; trim.to = d;
    $("trim").hidden = false;
    drawTrim();
    syncTrimButton();
    $("tin").focus({ preventScroll: true });
    requestAnimationFrame(loop);
  }
  function closeTrim() {
    trim.open = false; trim.drag = null;
    $("trim").hidden = true;
    syncTrimButton();
    fit();
  }
  function syncTrimButton() { const b = document.querySelector('#act [data-kind="trim"]'); if (b) b.setAttribute("aria-pressed", String(trim.open)); }
  // Moves one end, keeping the cut at least MIN_CUT long and inside the clip.
  function setEnd(which, t) {
    const c = trimClip();
    if (!c) return;
    const d = clipLength(c);
    if (which === "from") trim.from = Math.max(0, Math.min(snap(t), trim.to - MIN_CUT));
    else trim.to = Math.min(d, Math.max(snap(t), trim.from + MIN_CUT));
    drawTrim();
  }
  function drawTrim() {
    const c = trimClip();
    if (!trim.open || !c) return;
    const d = clipLength(c);
    trim.to = Math.min(trim.to, d);
    const pct = (t) => (100 * t / d) + "%";
    $("tsel").style.left = pct(trim.from); $("tsel").style.width = (100 * (trim.to - trim.from) / d) + "%";
    $("tin").style.left = pct(trim.from); $("tout").style.left = pct(trim.to);
    for (const [h, t, label] of [[$("tin"), trim.from, "In"], [$("tout"), trim.to, "Out"]]) {
      h.setAttribute("aria-valuemin", "0"); h.setAttribute("aria-valuemax", d.toFixed(2)); h.setAttribute("aria-valuenow", t.toFixed(2));
      h.setAttribute("aria-valuetext", label + " " + t.toFixed(2) + " s"); h.title = label + " " + t.toFixed(2) + " s (arrows: a frame, shift: 1 s)";
    }
    const whole = trim.from <= WHOLE && trim.to >= d - WHOLE;
    const len = $("tlen");
    len.replaceChildren("In ", el("b", "", trim.from.toFixed(2) + " s"), "  ·  Out ", el("b", "", trim.to.toFixed(2) + " s"), "  ·  Length ", el("b", "", (trim.to - trim.from).toFixed(2) + " s"),
      whole ? "  ·  drag a handle (the whole clip is nothing to cut)" : "");
    const act = $("tact");
    act.replaceChildren();
    const cmd = "pnpm cut " + c.no + " " + secs(trim.from) + " " + secs(trim.to);
    if (served) {
      const busy = jobs.get("cut:" + c.no)?.since;
      const save = el("button", "", busy ? "Saving..." : "Save cut");
      save.type = "button"; save.id = "tsave";
      save.disabled = whole || !!busy;
      save.addEventListener("click", () => make(c, "cut", { from: +secs(trim.from), to: +secs(trim.to) }));
      act.append(save);
    } else if (!whole) act.append(el("code", "", cmd), copyButton("Copy", cmd));
    const cancel = el("button", "", "Cancel");
    cancel.type = "button";
    cancel.addEventListener("click", closeTrim);
    act.append(cancel);
    fit();
  }
  // The playhead and the loop: back to in at the out point (or when played from outside the cut).
  function loop() {
    if (!trim.open) return;
    const v = $("player"), c = trimClip();
    if (c) {
      $("thead").style.left = (100 * v.currentTime / clipLength(c)) + "%";
      if (!v.paused && !trim.drag && (v.currentTime >= trim.to - 0.01 || v.currentTime < trim.from - 0.05)) v.currentTime = trim.from;
    }
    requestAnimationFrame(loop);
  }
  $("player").addEventListener("ended", () => { if (trim.open) { const v = $("player"); v.currentTime = trim.from; v.play().catch(() => {}); } });
  $("player").addEventListener("loadedmetadata", () => { if (trim.open) drawTrim(); });
  // Dragging: a handle, or the track (the nearer handle jumps there); the picture follows the handle.
  function timeAt(x) { const r = $("track").getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * clipLength(trimClip()); }
  $("track").addEventListener("pointerdown", (e) => {
    if (!trim.open || e.button !== 0) return;
    const t = timeAt(e.clientX);
    const which = e.target === $("tin") ? "from" : e.target === $("tout") ? "to" : Math.abs(t - trim.from) <= Math.abs(t - trim.to) ? "from" : "to";
    trim.drag = which;
    $("track").setPointerCapture(e.pointerId);
    $("player").pause();
    setEnd(which, t);
    $(which === "from" ? "tin" : "tout").focus({ preventScroll: true });
    $("player").currentTime = trim[which];
    e.preventDefault();
  });
  $("track").addEventListener("pointermove", (e) => {
    if (!trim.drag) return;
    setEnd(trim.drag, timeAt(e.clientX));
    $("player").currentTime = trim[trim.drag];
  });
  const endDrag = () => { trim.drag = null; };
  $("track").addEventListener("pointerup", endDrag);
  $("track").addEventListener("pointercancel", endDrag);
  for (const [id, which] of [["tin", "from"], ["tout", "to"]]) $(id).addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); e.stopPropagation();
    setEnd(which, trim[which] + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 1 : FRAME));
    $("player").currentTime = trim[which];
  });

  // Star: served, a toggle (and the s key) through POST /star/<no> or /unstar/<no>; the server
  // writes library/stars.json and rewrites index.html. From disk, the pnpm fav / unfav command.
  function starControl(c) {
    const on = starred.has(c.no);
    if (!served) {
      const cmd = (on ? "pnpm unfav " : "pnpm fav ") + c.no;
      const grp = el("span", "grp star");
      grp.append(el("span", "sg", on ? "★" : "☆"), el("code", "", cmd), copyButton("Copy", cmd));
      return grp;
    }
    const b = el("button", "star", on ? "★ Starred" : "☆ Star");
    b.type = "button";
    b.title = on ? "Unstar (s)" : "Star (s)";
    b.setAttribute("aria-pressed", String(on));
    b.addEventListener("click", () => toggleStar(c));
    return b;
  }
  let starBusy = false, starChanges = 0; // starChanges: a toggle since load outdates the startup refresh
  async function toggleStar(c, fromRow) {
    if (!c || !served || starBusy) return;
    starBusy = true; starChanges++;
    const on = starred.has(c.no);
    try {
      const r = await fetch("/" + (on ? "unstar" : "star") + "/" + c.no, { method: "POST" });
      if (!r.ok) { alert((on ? "Not unstarred: " : "Not starred: ") + ((await r.text().catch(() => "")) || r.status)); return; }
      const body = await r.json();
      starred.clear();
      for (const n of body.stars || []) starred.add(n);
    } catch (e) { alert("Not changed: " + e); return; } finally { starBusy = false; }
    render();
    // The rows were rebuilt: keep focus on the control just used.
    const again = fromRow ? document.querySelector('#rows button.rstar[data-id="' + c.id + '"]') : document.querySelector("#act .star");
    if (again) again.focus({ preventScroll: true });
  }
  // Film: one toggle, the first control in the row (and the f key). Served it saves through POST
  // /pick/<no> or /unpick/<no> at once; from disk the change is collected in the pending bar as the
  // pnpm pick / unpick commands to copy. pnpm film masters makes the picked clips.
  function filmControl(c) {
    const on = picked.has(c.no);
    const b = el("button", "filmtog");
    b.type = "button";
    b.append(el("span", "ic", on ? "✓" : "+"), on ? "In the film" : "Add to film");
    if (pickStore.unsaved(c.no)) b.append(el("span", "unsaved", "· not saved"));
    b.setAttribute("aria-pressed", String(on));
    b.title = (on ? "In the film: f takes it out" : "Not in the film: f adds it") + " (pnpm film masters makes the picked clips)";
    b.addEventListener("click", () => pickStore.toggle(c.no));
    return b;
  }
  // Every change, and every answer: the button, the list's marks and count, the sidebar's Film picks
  // count (render), and the pending bar; focus stays on the film button when it had it.
  function pickChanged() {
    const hadFocus = document.activeElement && document.activeElement.classList.contains("filmtog");
    render();
    if (hadFocus) { const b = document.querySelector("#act .filmtog"); if (b) b.focus({ preventScroll: true }); }
    drawPending();
  }
  function drawPending() {
    const cmds = pickStore.pending();
    const any = cmds.pick.length + cmds.unpick.length > 0;
    $("pending").hidden = !any;
    document.body.classList.toggle("has-pending", any);
    $("pending-what").replaceChildren("Film changes not saved: ", el("b", "", cmds.pick.length + " to pick, " + cmds.unpick.length + " to unpick"), ". Run these in the repo:");
    for (const [id, cmd, list] of [["cmd-pick", "pnpm pick ", cmds.pick], ["cmd-unpick", "pnpm unpick ", cmds.unpick]]) {
      $(id).hidden = !list.length;
      $(id).querySelector("code").textContent = cmd + list.join(" ");
    }
  }
  for (const id of ["cmd-pick", "cmd-unpick"]) {
    const b = $(id).querySelector("button");
    b.addEventListener("click", () => copyText($(id).querySelector("code").textContent).then(() => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy"; }, 1500); }, () => { b.textContent = "Copy failed"; }));
  }
  setInterval(() => { if (document.querySelector("#out .busy")) drawOut(); }, 1000);

  function step(d) {
    const list = shown();
    if (!list.length) return;
    const i = list.findIndex((c) => c.id === state.current);
    play(list[Math.min(list.length - 1, Math.max(0, (i < 0 ? 0 : i + d)))], true);
  }
  document.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.altKey || e.ctrlKey || e.metaKey) return;
    if (trim.open) {
      // While the trim bar is open: i / o set in and out at the playing position, Escape closes it,
      // and the page's own keys stay off while the bar has focus or a handle is dragged.
      if (e.key === "i" || e.key === "o") { e.preventDefault(); setEnd(e.key === "i" ? "from" : "to", $("player").currentTime); return; }
      if (e.key === "Escape") { e.preventDefault(); closeTrim(); return; }
      if (trim.drag || $("trim").contains(e.target)) return;
    }
    // On the focused player the arrows seek, as players do; j / k still step.
    const arrows = !(e.target instanceof HTMLVideoElement);
    if (e.key === "Delete" && served) { e.preventDefault(); remove(clips.find((c) => c.id === state.current)); return; }
    if (e.key === "s" && served) { e.preventDefault(); toggleStar(clips.find((c) => c.id === state.current)); return; }
    // f: the playing clip in or out of the film (not while typing: inputs and the select return above).
    if ((e.key === "f" || e.key === "F") && !e.shiftKey) {
      const c = clips.find((x) => x.id === state.current);
      if (c && c.no !== undefined && !(e.target instanceof HTMLTextAreaElement) && !e.target.isContentEditable) { e.preventDefault(); if (!e.repeat) pickStore.toggle(c.no); }
      return;
    }
    if ((arrows && e.key === "ArrowRight") || e.key === "j") { e.preventDefault(); step(1); }
    else if ((arrows && e.key === "ArrowLeft") || e.key === "k") { e.preventDefault(); step(-1); }
  });
  $("newest").addEventListener("click", () => {
    clearFilters(); $("sort").value = "added";
    render();
    const first = shown()[0];
    if (first) play(first, true);
  });
  $("find").addEventListener("input", render);
  $("sort").addEventListener("input", render);
  // Keep pages restored from the back/forward cache consistent with the reset controls.
  window.addEventListener("pageshow", (e) => { if (e.persisted) { clearFilters(); $("sort").value = "score"; render(); } });
  // Deep link (the death map links here): #clip=<no>[&t=<seconds>] clears the filters, selects that
  // clip and seeks to t once its metadata is in, clamped to its length. It never starts playback,
  // so sound still waits for a click or key. An unknown number changes nothing.
  const parseClipHash = /*__HASH__*/null;
  function followHash() {
    const h = parseClipHash && parseClipHash(location.hash);
    const c = h && clips.find((x) => x.no === h.no);
    if (!c) return;
    clearFilters();
    state.current = c.id;
    render();
    if (h.t === undefined) return;
    const v = $("player");
    // Only while that clip is still the selected one: a clip picked before the metadata came in keeps its own start.
    const seek = () => { if (state.current === c.id) v.currentTime = Math.min(h.t, Number.isFinite(v.duration) ? v.duration : h.t); };
    if (v.readyState >= 1) seek(); else v.addEventListener("loadedmetadata", seek, { once: true });
  }
  window.addEventListener("hashchange", followHash);
  $("deathmap").hidden = !data.hasDeathMap;
  render();
  followHash();
  // Served, the server's stars win over the inlined ones (a pnpm fav may have run since the page was written).
  if (served) fetch("/stars", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((b) => {
    if (!b || !Array.isArray(b.stars) || starChanges) return; // a toggle already brought newer stars
    starred.clear();
    for (const n of b.stars) starred.add(n);
    render();
  }).catch(() => {});
  // Served, the server's picks win over the inlined ones (a pnpm pick or the film picker may have changed them).
  pickStore.load();
</script>
</body>
</html>
